name: Windows portable build
on:
  push:
    branches: [main]
    paths: ['Windows/**', 'Assets/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Assets/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version after Windows checks pass (never overwrites an existing release)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Single source for the release version; build.ps1 stamps it into the app.
  VERSION: '2.1.1'
jobs:
  build:
    runs-on: windows-latest
    # Publishing happens in this same job: a separate release job needed a second runner,
    # and GitHub repeatedly failed to assign one ("job was not acquired by Runner").
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build app and bundle verified tools
        run: ./Windows/scripts/build.ps1 -Version $env:VERSION
      - name: Test core and bundled media processing
        run: |
          $env:YTDLP_TEST_TOOLS = (Resolve-Path 'Windows/dist/YT-DLP Studio/tools').Path
          dotnet run --project Windows/Tests/YtdlpStudio.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
      - name: Start native Windows interface
        run: |
          $app = Resolve-Path 'Windows/dist/YT-DLP Studio/YTDLPStudio.exe'
          $process = Start-Process $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content 'Windows/dist/YT-DLP Studio/smoke-test-error.txt' -ErrorAction SilentlyContinue
            throw 'Native UI smoke test failed.'
          }
      - name: Save native interface preview
        uses: actions/upload-artifact@v7
        with:
          name: Windows-interface-preview
          path: Windows/dist/YT-DLP Studio/Windows-smoke.png
          if-no-files-found: error
      - name: Package portable ZIP
        run: |
          Remove-Item 'Windows/dist/YT-DLP Studio/Windows-smoke.png'
          Compress-Archive -Path 'Windows/dist/YT-DLP Studio' -DestinationPath "Windows/dist/YT-DLP-Studio-$env:VERSION-Windows-x64.zip"
          Get-FileHash "Windows/dist/YT-DLP-Studio-$env:VERSION-Windows-x64.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: YT-DLP-Studio-${{ env.VERSION }}-Windows-x64
          path: Windows/dist/YT-DLP-Studio-${{ env.VERSION }}-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified Windows package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $zip = "Windows/dist/YT-DLP-Studio-$env:VERSION-Windows-x64.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Published releases are never replaced; bump VERSION at the top of this workflow instead.
            Write-Host "::error::$tag is already published. Bump VERSION in .github/workflows/windows.yml to release a new build."
            exit 1
          }
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "YT-DLP Studio $env:VERSION — Windows portable edition" `
            --notes-file Windows/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
