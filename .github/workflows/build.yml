name: Windows, macOS and Linux builds
on:
  push:
    branches: [main]
    paths: ['Windows/**', 'Linux/**', 'Sources/**', 'Tests/**', 'Package.swift', 'build.sh', 'AppIcon.icns', 'Assets/**', 'RELEASE-NOTES.md', '.github/workflows/build.yml']
  pull_request:
    paths: ['Windows/**', 'Linux/**', 'Sources/**', 'Tests/**', 'Package.swift', 'build.sh', 'AppIcon.icns', 'Assets/**', 'RELEASE-NOTES.md', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version for Windows, macOS and Linux after all checks pass (never overwrites an existing release)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Single source for the release version; both build scripts stamp it into the apps.
  VERSION: '2.2.1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build app and bundle verified tools
        run: ./Windows/scripts/build.ps1 -Version $env:VERSION
      - name: Test core and bundled media processing
        run: |
          $env:YTDLP_TEST_TOOLS = (Resolve-Path 'Windows/dist/Sipass/tools').Path
          dotnet run --project Windows/Tests/YtdlpStudio.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
      - name: Start native Windows interface
        run: |
          $app = Resolve-Path 'Windows/dist/Sipass/Sipass.exe'
          $process = Start-Process $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content 'Windows/dist/Sipass/smoke-test-error.txt' -ErrorAction SilentlyContinue
            throw 'Native UI smoke test failed.'
          }
      - name: Save native interface preview
        uses: actions/upload-artifact@v7
        with:
          name: Windows-interface-preview
          path: Windows/dist/Sipass/Windows-smoke*.png
          if-no-files-found: error
      - name: Package portable ZIP
        run: |
          Remove-Item 'Windows/dist/Sipass/Windows-smoke*.png'
          Compress-Archive -Path 'Windows/dist/Sipass' -DestinationPath "Windows/dist/Sipass-$env:VERSION-Windows-x64.zip"
          Get-FileHash "Windows/dist/Sipass-$env:VERSION-Windows-x64.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: Sipass-${{ env.VERSION }}-Windows-x64
          path: Windows/dist/Sipass-${{ env.VERSION }}-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install yt-dlp and FFmpeg for integration tests
        run: brew install yt-dlp ffmpeg
      - name: Test
        run: swift test
      - name: Build universal app
        run: ./build.sh universal
      - name: Verify app bundle
        run: |
          APP="build/Sipass.app"
          archs=$(lipo -archs "$APP/Contents/MacOS/Sipass")
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::Expected a universal arm64 + x86_64 binary"; exit 1; }
          codesign --verify --deep --strict "$APP"
          bundled=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [[ "$bundled" == "$VERSION" ]] || { echo "::error::Info.plist says $bundled, expected $VERSION"; exit 1; }
      - name: Launch smoke test
        run: |
          "build/Sipass.app/Contents/MacOS/Sipass" & pid=$!
          sleep 8
          kill -0 $pid || { echo "::error::App exited during launch"; exit 1; }
          kill $pid
      - name: Package ZIP
        run: |
          # ditto keeps the code signature and bundle metadata intact.
          ditto -c -k --keepParent "build/Sipass.app" "Sipass-$VERSION-macOS.zip"
          shasum -a 256 "Sipass-$VERSION-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Sipass-${{ env.VERSION }}-macOS
          path: Sipass-${{ env.VERSION }}-macOS.zip
          retention-days: 30
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build app and bundle verified tools
        run: Linux/scripts/build.sh "$VERSION"
      - name: Test core and bundled media processing
        run: |
          export YTDLP_TEST_TOOLS="$PWD/Linux/dist/Sipass/tools"
          dotnet run --project Windows/Tests/YtdlpStudio.Tests.csproj -c Release
      - name: Start interface on a virtual display
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libice6 libsm6 libfontconfig1
          if ! xvfb-run -a -s "-screen 0 1600x1000x24" "Linux/dist/Sipass/Sipass" --smoke-test "$RUNNER_TEMP"; then
            cat "$RUNNER_TEMP/smoke-test-error.txt" 2>/dev/null || true
            echo "::error::Linux interface smoke test failed"; exit 1
          fi
          ls -l "$RUNNER_TEMP"/Linux-smoke*.png
      - name: Save interface preview
        uses: actions/upload-artifact@v7
        with:
          name: Linux-interface-preview
          path: ${{ runner.temp }}/Linux-smoke*.png
          if-no-files-found: error
      - name: Package portable archive
        run: |
          # tar keeps the executable bits that a ZIP would lose.
          tar -C Linux/dist -czf "Sipass-$VERSION-Linux-x64.tar.gz" "Sipass"
          sha256sum "Sipass-$VERSION-Linux-x64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: Sipass-${{ env.VERSION }}-Linux-x64
          path: Sipass-${{ env.VERSION }}-Linux-x64.tar.gz
          retention-days: 30
          if-no-files-found: error

  release:
    # Runs only after all three platform builds pass. If GitHub fails to assign this job a runner,
    # use "Re-run failed jobs": the verified builds are reused, nothing is rebuilt.
    needs: [windows, macos, linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: Sipass-${{ env.VERSION }}-*
          merge-multiple: true
          path: package
      - name: Publish Windows, macOS and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          win="package/Sipass-$VERSION-Windows-x64.zip"
          mac="package/Sipass-$VERSION-macOS.zip"
          linux="package/Sipass-$VERSION-Linux-x64.tar.gz"
          ls -l package
          [[ -f "$win" && -f "$mac" && -f "$linux" ]] || { echo "::error::Missing a platform package"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Published releases are never replaced; bump VERSION at the top of this workflow instead.
            echo "::error::$tag is already published. Bump VERSION in .github/workflows/build.yml to release a new build."
            exit 1
          fi
          gh release create "$tag" "$win" "$mac" "$linux" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sipass $VERSION — Windows, macOS and Linux" \
            --notes-file RELEASE-NOTES.md --latest
